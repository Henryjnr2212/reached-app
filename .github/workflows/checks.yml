name: Checks

on:
  pull_request:
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

env:
  MESSAGING_MODE: fake

jobs:
  static:
    name: typecheck, lint, test, test:functions
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm test:functions

  db:
    name: test:db
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Postgres 16 with pgTAP and pg_cron
        run: |
          sudo apt-get update -q
          sudo apt-get install -yq postgresql-16 postgresql-16-pgtap postgresql-16-cron libtap-parser-sourcehandler-pgtap-perl
      - run: bash scripts/test-db.sh
        env:
          PG_BIN: /usr/lib/postgresql/16/bin

  e2e:
    name: test:e2e
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            e2e/**/test-results
            playwright-report
          if-no-files-found: ignore
